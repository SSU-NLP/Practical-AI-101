<svg width="100%" viewBox="0 0 1180 452" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RAG: 문서 없이 묻는 경우와 근거를 찾아 건네는 경우의 비교</title>
<desc>위쪽 흐름은 질문이 곧바로 LLM으로 들어가 근거 없는 답이 나오는 환각 상황이다. 아래쪽 흐름은 같은 질문으로 먼저 문서 인덱스를 검색해 관련 조각을 찾고, 질문과 근거를 함께 LLM에 건네 출처가 붙은 답을 받는 RAG 구조이다.</desc>
<defs>
<marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E24B4A"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#378ADD"/></marker>
</defs>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif">

<!-- ================= 위: 그냥 물어보는 경우 ================= -->
<text x="40" y="38" font-size="16" font-weight="700" fill="#A32D2D">① 그냥 물어보면 · 암기 시험</text>

<rect x="40" y="56" width="180" height="76" rx="9" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="130" y="86" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">질문</text>
<text x="130" y="108" font-size="11.5" fill="#5F5E5A" text-anchor="middle">“나눔벗은 몇 명 뽑아?”</text>

<line x1="222" y1="94" x2="266" y2="94" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrR)"/>

<rect x="270" y="56" width="170" height="76" rx="9" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="355" y="86" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">LLM</text>
<text x="355" y="108" font-size="11.5" fill="#5F5E5A" text-anchor="middle">학습 때 본 것만 안다</text>

<line x1="442" y1="94" x2="486" y2="94" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrR)"/>

<rect x="490" y="56" width="320" height="76" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.8"/>
<text x="650" y="86" font-size="15" font-weight="700" fill="#A32D2D" text-anchor="middle">그럴듯하지만 근거가 없는 답</text>
<text x="650" y="108" font-size="11.5" fill="#993C1D" text-anchor="middle">환각(hallucination) · 출처를 댈 수 없다</text>

<text x="840" y="88" font-size="12.5" fill="#888780">본 적 없는 공지라도</text>
<text x="840" y="107" font-size="12.5" fill="#888780">문장은 자신 있게 완성된다</text>

<line x1="40" y1="168" x2="1140" y2="168" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 5"/>

<!-- ================= 아래: RAG ================= -->
<text x="40" y="208" font-size="16" font-weight="700" fill="#042C53">② RAG로 물어보면 · 오픈북 시험</text>

<rect x="40" y="226" width="180" height="82" rx="9" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="130" y="258" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">질문</text>
<text x="130" y="280" font-size="11.5" fill="#5F5E5A" text-anchor="middle">“나눔벗은 몇 명 뽑아?”</text>

<line x1="222" y1="267" x2="256" y2="267" stroke="#378ADD" stroke-width="2" marker-end="url(#arrB)"/>

<rect x="260" y="226" width="200" height="82" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.8"/>
<text x="360" y="252" font-size="15" font-weight="700" fill="#042C53" text-anchor="middle">검색 (Retrieval)</text>
<text x="360" y="273" font-size="11.5" fill="#042C53" text-anchor="middle">임베딩으로 좌표를 만들고</text>
<text x="360" y="290" font-size="11.5" fill="#042C53" text-anchor="middle">FAISS로 가까운 조각을 고른다</text>

<line x1="462" y1="267" x2="496" y2="267" stroke="#378ADD" stroke-width="2" marker-end="url(#arrB)"/>

<rect x="500" y="226" width="200" height="82" rx="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.8"/>
<text x="600" y="252" font-size="15" font-weight="700" fill="#633806" text-anchor="middle">증강 (Augmented)</text>
<text x="600" y="273" font-size="11.5" fill="#633806" text-anchor="middle">질문 + 찾아온 근거 조각을</text>
<text x="600" y="290" font-size="11.5" fill="#633806" text-anchor="middle">한 프롬프트에 담는다</text>

<line x1="702" y1="267" x2="736" y2="267" stroke="#378ADD" stroke-width="2" marker-end="url(#arrB)"/>

<rect x="740" y="226" width="150" height="82" rx="9" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="815" y="258" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">LLM</text>
<text x="815" y="280" font-size="11.5" fill="#5F5E5A" text-anchor="middle">같은 모델 그대로</text>

<line x1="892" y1="267" x2="926" y2="267" stroke="#378ADD" stroke-width="2" marker-end="url(#arrB)"/>

<rect x="930" y="226" width="210" height="82" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.8"/>
<text x="1035" y="252" font-size="15" font-weight="700" fill="#042C53" text-anchor="middle">근거를 짚은 답 (Generation)</text>
<text x="1035" y="273" font-size="11.5" fill="#042C53" text-anchor="middle">“총 5명 내외를 선발합니다”</text>
<text x="1035" y="290" font-size="11.5" fill="#173404" text-anchor="middle">+ 출처 공고 제목</text>

<!-- 문서 저장소 -->
<rect x="260" y="368" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#888780" stroke-width="1.6"/>
<text x="360" y="394" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="middle">서울문화포털 공지 123건</text>
<text x="360" y="415" font-size="11.5" fill="#5F5E5A" text-anchor="middle">→ 청크 300개를 인덱스에 저장</text>
<line x1="360" y1="364" x2="360" y2="318" stroke="#378ADD" stroke-width="2" marker-end="url(#arrB)"/>

<text x="500" y="398" font-size="12.5" fill="#888780">모델을 다시 학습시키지 않는다.</text>
<text x="500" y="418" font-size="12.5" fill="#888780">답할 때 참고 자료를 쥐여 줄 뿐이다.</text>

</g>
</svg>
